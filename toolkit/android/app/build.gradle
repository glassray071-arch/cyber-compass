plugins {
    id 'com.android.application'
}

android {
    namespace 'nz.eloni.cybertoolkit'
    compileSdk 34

    defaultConfig {
        applicationId 'nz.eloni.cybertoolkit'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can update the
        // previous install without "app not installed" signature errors.
        shared {
            storeFile file('cybertoolkit.keystore')
            storePassword 'cybertoolkit'
            keyAlias 'cybertoolkit'
            keyPassword 'cybertoolkit'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
