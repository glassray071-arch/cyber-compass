name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CyberCompass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CyberCompass-apk
          path: CyberCompass.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Cyber Compass APK v1.0.${{ github.run_number }}
          body: |
            Download **CyberCompass.apk** below on your Android phone and open it to install.
            (Allow your browser / Files app to "install unknown apps" when asked.)
          files: CyberCompass.apk
          make_latest: true
