name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile cyber_compass.py
      - name: Self-test (tilt-compensated heading maths + layout)
        run: python cyber_compass.py --selftest
      - name: Demo smoke test
        run: |
          COLUMNS=50 LINES=40 python cyber_compass.py --demo --no-color --frames 5 > frame.txt
          python cyber_compass.py --demo --plain --frames 5
          tail -n 40 frame.txt
